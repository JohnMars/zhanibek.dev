<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>404 - Zhanibek Marshal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="fonts.css">
<style>
:root {
  --paper: #faf8f3; --paper-2: #f3efe6; --ink: #1a1815; --ink-2: #4a463e; --ink-3: #7a7468;
  --accent: oklch(0.58 0.14 35); --rule: #d9d3c4;
  --serif: "Newsreader", "Iowan Old Style", "Palatino", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --type-meta: 0.78rem;
  color-scheme: light;
}
html[data-theme="dark"] {
  --paper: #15171a; --paper-2: #1d1f23; --ink: #e8e6e1; --ink-2: #b8b5ae; --ink-3: #7a7770; --rule: #2c2f34; --accent: oklch(0.72 0.13 38); color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  html:not([data-theme]) { --paper: #15171a; --paper-2: #1d1f23; --ink: #e8e6e1; --ink-2: #b8b5ae; --ink-3: #7a7770; --rule: #2c2f34; --accent: oklch(0.72 0.13 38); color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); transition: border-color 120ms, color 120ms; }
a:hover { border-bottom-color: var(--accent); color: var(--accent); }
.shell { max-width: 56rem; margin: 0 auto; padding: 2rem clamp(1.25rem, 4vw, 2.5rem) 6rem; }
.site-header { display: flex; justify-content: space-between; align-items: baseline; gap: 1.25rem; padding-bottom: 2rem; border-bottom: 1px solid var(--rule); margin-bottom: 3.5rem; flex-wrap: wrap; }
.brand { font-family: var(--serif); font-size: 1rem; font-weight: 500; letter-spacing: 0.01em; border: 0; color: var(--ink); }
.brand .dot { display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin-right: 0.5rem; transform: translateY(-3px); }
nav.primary { display: flex; gap: 1.25rem; font-family: var(--mono); font-size: var(--type-meta); letter-spacing: 0.04em; text-transform: lowercase; align-items: center; flex-wrap: wrap; }
nav.primary a { color: var(--ink-2); border: 0; padding-bottom: 2px; border-bottom: 1px solid transparent; }
nav.primary a:hover { color: var(--ink); border-bottom-color: var(--ink-3); }
.utilities { display: flex; gap: 0.5rem; align-items: center; margin-left: 0.5rem; }
.icon-btn { background: transparent; border: 1px solid transparent; color: var(--ink-2); width: 28px; height: 28px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 0.7rem; transition: background 120ms, color 120ms; }
.icon-btn:hover { background: var(--paper-2); color: var(--ink); }
.icon-btn svg { width: 14px; height: 14px; }
.content { max-width: 38rem; }
.eyebrow { font-family: var(--mono); font-size: var(--type-meta); text-transform: lowercase; letter-spacing: 0.06em; color: var(--ink-3); margin-bottom: 1.25rem; }
h1 { font-weight: 400; font-size: clamp(2.2rem, 1.4rem + 3.5vw, 3.6rem); line-height: 1.05; margin: 0 0 1.25rem; }
p { font-size: 1.125rem; line-height: 1.55; color: var(--ink-2); margin: 0 0 1.25rem; }
</style>
<script>(function(){const t=localStorage.getItem("zm.theme");if(t&&t!=="system")document.documentElement.setAttribute("data-theme",t);const d=localStorage.getItem("zm.density");if(d)document.documentElement.setAttribute("data-density",d);})();</script>
</head>
<body>

<header class="site-header shell" style="padding-bottom:0; margin-bottom:0; border:0;">
  <a href="index.html" class="brand"><span class="dot"></span>Zhanibek Marshal</a>
  <nav class="primary">
    <a href="index.html">home</a>
    <a href="articles.html">articles</a>
    <a href="talks.html">talks</a>
    <a href="resume.html">resume</a>
    <a href="now.html">now</a>
    <a href="books.html">books</a>
    <span class="utilities">
      <a class="icon-btn" href="feed.xml"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3a10 10 0 0 1 10 10"/><path d="M3 8a5 5 0 0 1 5 5"/><circle cx="3.5" cy="12.5" r="1" fill="currentColor"/></svg></a>
      <button class="icon-btn" data-theme-toggle>◐</button>
    </span>
  </nav>
</header>

<main class="shell">
  <div class="content">
    <p class="eyebrow">404</p>
    <h1>Nothing here.</h1>
    <p>This page doesn't exist. Head back <a href="index.html">home</a> or check the nav above.</p>
  </div>
</main>

<script>
(function() {
  const THEME_KEY = "zm.theme";
  function applyTheme(t) {
    if (t === "system" || !t) document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }
  function currentTheme() { return localStorage.getItem(THEME_KEY) || "system"; }
  function nextTheme(t) { return t === "light" ? "dark" : t === "dark" ? "system" : "light"; }
  function setLabel(btn) {
    const t = currentTheme();
    btn.textContent = t === "light" ? "☀" : t === "dark" ? "☾" : "◐";
  }
  applyTheme(currentTheme());
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.querySelector("[data-theme-toggle]");
    if (btn) {
      setLabel(btn);
      btn.addEventListener("click", () => {
        const t = nextTheme(currentTheme());
        localStorage.setItem(THEME_KEY, t);
        applyTheme(t);
        setLabel(btn);
      });
    }
  });
})();
</script>
</body>
</html>
