<style>
:root {
  --paper: #faf8f3; --ink: #1a1815; --ink-2: #4a463e; --ink-3: #7a7468;
  --accent: oklch(0.58 0.14 35); --rule: #d9d3c4;
  --serif: "Newsreader", Georgia, serif;
  --mono: "JetBrains Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #15171a; --ink: #e8e6e1; --ink-2: #b8b5ae; --ink-3: #7a7770; --rule: #2c2f34; --accent: oklch(0.72 0.13 38); color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); transition: border-color 120ms, color 120ms; }
a:hover { border-bottom-color: var(--accent); color: var(--accent); }
.shell { max-width: 56rem; margin: 0 auto; padding: 2rem clamp(1.25rem, 4vw, 2.5rem) 6rem; }
.site-header { display: flex; justify-content: space-between; align-items: baseline; gap: 1.25rem; padding-bottom: 2rem; border-bottom: 1px solid var(--rule); margin-bottom: 3.5rem; flex-wrap: wrap; }
.brand { font-family: var(--serif); font-size: 1rem; font-weight: 500; border: 0; color: var(--ink); }
.brand .dot { display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; margin-right: 0.5rem; transform: translateY(-3px); }
nav { display: flex; gap: 1.25rem; font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.04em; text-transform: lowercase; flex-wrap: wrap; }
nav a { color: var(--ink-2); border: 0; padding-bottom: 2px; border-bottom: 1px solid transparent; }
nav a:hover { color: var(--ink); border-bottom-color: var(--ink-3); }
.content { max-width: 38rem; }
.eyebrow { font-family: var(--mono); font-size: 0.78rem; text-transform: lowercase; letter-spacing: 0.06em; color: var(--ink-3); margin-bottom: 1.25rem; }
h1 { font-weight: 400; font-size: clamp(2.2rem, 1.4rem + 3.5vw, 3.6rem); line-height: 1.05; margin: 0 0 1.25rem; }
p { font-size: 1.125rem; line-height: 1.55; color: var(--ink-2); margin: 0 0 1.25rem; }
</style>
<script>(function(){const t=localStorage.getItem("zm.theme");if(t&&t!=="system")document.documentElement.setAttribute("data-theme",t);})();</script>

</main>
